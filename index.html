<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph -->
    <meta property="og:title" content="LimeZero Studio LLC">
    <meta property="og:description" content="Official website of LimeZero Studio LLC, developer of Ember Veil - Tale in Cinders.">
    <meta property="og:image" content="https://limezerogames.com/images/og-image.png">
    <meta property="og:url" content="https://limezerogames.com/">
    <meta property="og:type" content="website">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">

    <title>LimeZero Studio LLC</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        LimeZero Studio LLC
    </header>

    <main class="main-layout">

        <!-- Left Side -->
        <section class="left-panel">

            <!-- Gameplay Video -->
            <div class="video-container">
                <video
                    class="gameplay-video"
                    controls
                    autoplay
                    muted
                    loop
                    playsinline
                >
                    <source src="videos/gameplay.mp4" type="video/mp4">

                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Game Title -->
            <img
                class="title-logo"
                src="images/Title.png"
                alt="Ember Veil - Tale in Cinders"
            >

        </section>


        <!-- Right Side -->
        <section class="right-panel">

            <!-- Character -->
            <img
                class="character"
                src="images/Last_Emberkin.png"
                alt="Ember Veil character"
            >

            <!-- Links -->
            <div class="links">

                <a
                    class="icon-link"
                    href="https://x.com/LimeZero13"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LimeZero Studio on X"
                >
                    <img
                        class="x-icon"
                        src="images/logo-white.png"
                        alt=""
                    >
                </a>

                <div class="icon-link steam-coming-soon">
                    <img
                        class="steam-icon"
                        src="images/steam-logo-white.png"
                        alt="Steam"
                    >

                    <span class="tooltip">
                        Steam page coming soon!
                    </span>
                </div>

            </div>

        </section>

    </main>

    <footer>
        © 2026 LimeZero Studio LLC. All rights reserved.
    </footer>

</body>

</html>
